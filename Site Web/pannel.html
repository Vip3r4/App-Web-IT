<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartGH - Pannel</title>
    <link rel="stylesheet" href="style-pannel.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="API-fetch.js"></script>
    <script type="module" src="API-post.js"></script>
    <script type="module" src="chart.js"></script>
    <script src="https://kit.fontawesome.com/6ce492d5d4.js" crossorigin="anonymous"></script>
    <link rel="icon" href="logo.png">
</head>
<body>
    <header>
        <img src="logo.png" alt="logo" class="logo">
        <h2>SmartGH</h2>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Accueil</a>
                </li>
                <li>
                    <a href="about.html" class="active">À Propos</a>
                </li>
            </ul>
        </nav>
    </header>
    <button class="objectif">SmartGH</button>    
        <h1>Panneau de Configuration</h1>
    <div class="container">
            <aside class="sidebar">
                <div class="logo-sidebar">
                    <img src="logo.png">
                </div>

                <navi class="menu">
                    
                </navi>

                <div class="leave">
                    <a href="index.html"><i class="fa-solid fa-right-from-bracket fa-xl"></i></a>
                </div>

                <div class="version-box">
                    <div class="divider"></div>
                    <div class="version">v1.0</div>
                </div>
            </aside>

            <main class="content">
                <div class="temp">
                    <h2>Température</h2>
                    <input id="tempChanger" type="range" min="14" max="28">
                    <span id="Temp">--</span>
                    <canvas id="tempChart" width="400" height="200"></canvas>
                </div>
                <div class="angle">
                    <p>Angle d'ouverture : <input id="angleChanger" type="range" min="5" max="15"><span id="Angle">--</span></p>
                </div>
                <div class="led" id="led">
                    <p>Etat led : <span id="EtatLed">--</span></p>
                    <label class="switch">
                        <input type="checkbox" id="etatledchanger">
                        <div class="slider"></div>
                    </label>
                </div>
                <div class="alarm" id="alarm">
                    <p>Etat alarme : <span id="EtatAlarm">--</span></p>
                </div>
            </main>
        </div>
    <footer>
        <p>© 2026 SmartGH. Tous droits réservés.</p>
    </footer>
    <script src="API-fetch.js"></script>
    <script src="API-post.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
        var checkbox = document.querySelector('input[type="checkbox"]');

        checkbox.addEventListener('change', async () => {
            if (checkbox.checked) {
                const inputValue = "true";
                try {
                    const res = await fetch("http://localhost:8000/api/serre");
                    const currentState = await res.json();
                    currentState.etatled = inputValue;
                    await fetch("http://localhost:8000/api/serre/update", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(currentState)
                    });
                    console.log("Etat envoyé :", inputValue);
                } catch (err) {
                    console.error("Impossible de changer l'etat de la led'", err);
                }
            } else {
                const inputValue2 = "false";
                try {
                    const res = await fetch("http://localhost:8000/api/serre");
                    const currentState = await res.json();
                    currentState.etatled = inputValue2;
                    await fetch("http://localhost:8000/api/serre/update", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(currentState)
                    });
                    console.log("Etat envoyé :", inputValue2);
                } catch (err) {
                    console.error("Impossible de changer l'etat de la led'", err);
                }
            }
        });
        });
    </script>
</body>
</html>
